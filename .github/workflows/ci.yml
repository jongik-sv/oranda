name: ci

on:
  push:
    branches: [main, 'dev-*']
    # v* 태그 푸시 = 릴리스(아래 release 작업이 GitHub Release 를 만든다). 보통 푸시·PR 은 산출물만 남긴다.
    tags: ['v*']
  pull_request:
    branches: [main, 'dev-*']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  VPK_VERSION: 1.2.161
  # 설치본이 기본으로 확인할 업데이트 피드(설정의 주소가 비었을 때). 로컬 빌드는 이 값 없이 「피드 없음」.
  ORANDA_UPDATE_FEED: https://github.com/jongik-sv/oranda

jobs:
  windows:
    name: windows-x64 (build, unit, ui, perf, package)
    runs-on: windows-latest
    env:
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
      # SignPath Foundation 오픈 소스 서명(D-014). 비밀값이 없으면(승인 전·포크 PR) 서명 없이 패키지한다.
      # 서명 요청은 사람이 SignPath 에서 승인해야 끝나므로 릴리스 때만 보낸다.
      HAS_SIGNPATH: ${{ secrets.SIGNPATH_API_TOKEN != '' && secrets.SIGNPATH_ORGANIZATION_ID != '' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # 패키지 버전: macOS 작업과 같은 규칙(태그 vX.Y.Z 면 X.Y.Z, 그 밖에는 0.1.<실행 번호>).
      - name: Resolve package version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          else
            VER="0.1.${{ github.run_number }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - run: dotnet build Oranda.sln -c Release
      - name: Unit and UI tests
        run: dotnet test Oranda.sln -c Release --no-build --filter "Category!=Integration&Category!=Perf"
      - name: Publish app
        run: dotnet publish src/Oranda.App -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -p:Version=${{ steps.ver.outputs.version }} -p:OrandaUpdateFeed=${{ env.ORANDA_UPDATE_FEED }} -o artifacts/publish/win-x64
      - name: Startup perf (5 runs)
        # 예산 초과 시 실패시키려면 --enforce 를 붙인다(예산 확정 전까지 보고만).
        run: dotnet run --project tests/Oranda.Perf -c Release -- --exe artifacts/publish/win-x64/Oranda.App.exe --runs 5 --out artifacts/perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-windows-x64
          path: artifacts/perf/
          if-no-files-found: warn
      # LICENSE·THIRD-PARTY-NOTICES·네이티브 고지를 설치 폴더 licenses/ 에 넣는다(Oracle 라이선스가 배포본마다 사본을 요구).
      - name: Bundle license notices
        shell: pwsh
        run: scripts/release/copy-notices.ps1 -PublishDir artifacts/publish/win-x64 -Os win
      - name: Install vpk
        shell: pwsh
        run: dotnet tool install -g vpk --version "$env:VPK_VERSION"
      # 릴리스 때만: 이전 릴리스를 받아 두면 vpk pack 이 델타 패키지를 만든다. 첫 릴리스는 받을 것이 없으므로 실패를 넘긴다.
      - name: Download previous release (for deltas)
        if: env.IS_RELEASE == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk download github --channel win --repoUrl "https://github.com/${{ github.repository }}" --token "$GITHUB_TOKEN" --outputDir artifacts/release/win || echo "no previous release to download"
      # 서명 1단계: Oranda 자신의 exe·dll 만 SignPath 에 보낸다(외부 라이브러리는 원래 서명을 두거나 무서명 — SignPath OSS 조건).
      # Velopack 의 Update.exe 는 외부 바이너리라 서명하지 않는다. SignPath 프로젝트의 artifact configuration `app-files` 가 zip 안의 Oranda*.exe·Oranda*.dll 을 서명한다.
      - name: Upload app files for signing
        id: unsigned-app
        if: env.HAS_SIGNPATH == 'true' && env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-input-app
          path: artifacts/publish/win-x64/Oranda.*
          if-no-files-found: error
          retention-days: 1
      - name: Sign app files (SignPath)
        if: env.HAS_SIGNPATH == 'true' && env.IS_RELEASE == 'true'
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'oranda' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: app-files
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          wait-for-completion: true
          # 승인자가 손으로 승인할 때까지 기다린다.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed/app
      - name: Use signed app files
        if: env.HAS_SIGNPATH == 'true' && env.IS_RELEASE == 'true'
        shell: pwsh
        run: Copy-Item artifacts/signed/app/* artifacts/publish/win-x64 -Force
      # 서명 매개변수 없이 묶는다(서명은 SignPath 가 앞뒤 단계에서 한다). Setup.exe·Portable zip·full/delta nupkg·releases.win.json.
      - name: Package
        run: >
          vpk pack --packId Oranda --packVersion "${{ steps.ver.outputs.version }}" --packTitle Oranda --packAuthors jongik-sv
          --channel win --runtime win-x64 --packDir artifacts/publish/win-x64 --mainExe Oranda.App.exe --outputDir artifacts/release/win
      # 서명 2단계: Setup.exe(내려받을 때 SmartScreen 이 보는 파일). artifact configuration `installer`.
      - name: Upload installer for signing
        id: unsigned-setup
        if: env.HAS_SIGNPATH == 'true' && env.IS_RELEASE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: signing-input-setup
          path: artifacts/release/win/Oranda-win-Setup.exe
          if-no-files-found: error
          retention-days: 1
      - name: Sign installer (SignPath)
        if: env.HAS_SIGNPATH == 'true' && env.IS_RELEASE == 'true'
        uses: signpath/github-action-submit-signing-request@v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'oranda' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-setup.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: artifacts/signed/setup
      - name: Use signed installer
        if: env.HAS_SIGNPATH == 'true' && env.IS_RELEASE == 'true'
        shell: pwsh
        run: Copy-Item artifacts/signed/setup/Oranda-win-Setup.exe artifacts/release/win/Oranda-win-Setup.exe -Force
      # 무서명 개수만 알린다(외부 dll 은 무서명이 정상이라 -RequireSigned 를 쓰지 않는다).
      - name: Signature report
        shell: pwsh
        run: scripts/release/check-signatures.ps1 -Dir artifacts/release/win
      - name: Installer size check (80 MB)
        shell: pwsh
        run: scripts/release/check-installer-size.ps1 -Dir artifacts/release/win
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-x64
          path: artifacts/release/win/
          if-no-files-found: error

  macos:
    name: macos-arm64 (build, unit, ui, package)
    runs-on: macos-14
    env:
      HAS_APPLE_SECRETS: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 != '' }}
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # 패키지 버전: 태그 vX.Y.Z 면 X.Y.Z, 그 밖에는 0.1.<실행 번호>.
      - name: Resolve package version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VER="${GITHUB_REF_NAME#v}"
            [[ "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }
          else
            VER="0.1.${{ github.run_number }}"
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
      - run: dotnet build Oranda.sln -c Release
      - name: Unit and UI tests
        run: dotnet test Oranda.sln -c Release --no-build --filter "Category!=Integration&Category!=Perf"
      - name: Publish app
        run: dotnet publish src/Oranda.App -c Release -r osx-arm64 --self-contained -p:PublishReadyToRun=true -p:Version=${{ steps.ver.outputs.version }} -p:OrandaUpdateFeed=${{ env.ORANDA_UPDATE_FEED }} -o artifacts/publish/osx-arm64
      - name: Bundle license notices
        shell: pwsh
        run: scripts/release/copy-notices.ps1 -PublishDir artifacts/publish/osx-arm64 -Os osx
      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION"
      # 릴리스 때만: 이전 릴리스를 받아 두면 vpk pack 이 델타 패키지를 만든다. 첫 릴리스는 받을 것이 없으므로 실패를 넘긴다.
      - name: Download previous release (for deltas)
        if: env.IS_RELEASE == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: vpk download github --channel osx --repoUrl "https://github.com/${{ github.repository }}" --token "$GITHUB_TOKEN" --outputDir artifacts/release || echo "no previous release to download"
      - name: Import signing certificate
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/oranda.keychain-db"
          echo "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KC"
          security list-keychains -d user -s "$KC" login.keychain
      - name: Store notarytool profile
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: xcrun notarytool store-credentials oranda-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
      - name: Package (signed and notarized)
        if: env.HAS_APPLE_SECRETS == 'true'
        env:
          APPLE_SIGN_APP_IDENTITY: ${{ secrets.APPLE_SIGN_APP_IDENTITY }}
          APPLE_SIGN_INSTALL_IDENTITY: ${{ secrets.APPLE_SIGN_INSTALL_IDENTITY }}
        run: >
          vpk pack --packId Oranda --packVersion "${{ steps.ver.outputs.version }}"
          --packDir artifacts/publish/osx-arm64 --mainExe Oranda.App
          --signAppIdentity "$APPLE_SIGN_APP_IDENTITY" --signInstallIdentity "$APPLE_SIGN_INSTALL_IDENTITY"
          --notaryProfile oranda-notary --outputDir artifacts/release
      - name: Package (unsigned, no secrets)
        if: env.HAS_APPLE_SECRETS != 'true'
        run: >
          vpk pack --packId Oranda --packVersion "${{ steps.ver.outputs.version }}"
          --packDir artifacts/publish/osx-arm64 --mainExe Oranda.App --outputDir artifacts/release
      - name: Verify signature and Gatekeeper
        if: env.HAS_APPLE_SECRETS == 'true'
        run: |
          APP=$(find artifacts/release -name '*.app' -maxdepth 2 | head -n1)
          if [ -n "$APP" ]; then
            codesign --verify --deep --strict --verbose=2 "$APP"
            spctl --assess --type execute --verbose "$APP"
          fi
      - name: Installer size check (80 MB)
        run: |
          for f in artifacts/release/*Setup* artifacts/release/*.pkg; do
            [ -e "$f" ] || continue
            s=$(stat -f%z "$f"); echo "$f $s"
            [ "$s" -le 83886080 ] || { echo "too large"; exit 1; }
          done
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos-arm64
          path: artifacts/release/
          if-no-files-found: warn

  # GitHub Release 올리기: v* 태그 푸시 또는 수동 실행 때만. 쓰기 권한은 이 작업에만 준다(토큰은 GITHUB_TOKEN 뿐).
  # Windows(win)·macOS(osx) 두 채널을 한 릴리스에 올린다. 러너가 Linux 라 vpk 기본 채널(linux)이 되지 않도록 채널을 꼭 적는다.
  release:
    name: publish GitHub Release
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check versions match
        run: |
          [ "${{ needs.windows.outputs.version }}" = "${{ needs.macos.outputs.version }}" ] || { echo "version mismatch: win ${{ needs.windows.outputs.version }} / osx ${{ needs.macos.outputs.version }}"; exit 1; }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@v4
        with:
          name: release-windows-x64
          path: artifacts/release/win
      - uses: actions/download-artifact@v4
        with:
          name: release-macos-arm64
          path: artifacts/release/osx
      - name: Install vpk
        run: dotnet tool install -g vpk --version "$VPK_VERSION"
      # --merge: 두 번째 채널을 같은 태그의 릴리스에 더한다(다시 실행해도 같은 릴리스에 붙는다).
      - name: Upload to GitHub Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.macos.outputs.version }}
        run: |
          for CH in win osx; do
            vpk upload github --channel "$CH" --outputDir "artifacts/release/$CH" \
              --repoUrl "https://github.com/${{ github.repository }}" --token "$GITHUB_TOKEN" \
              --publish --merge --releaseName "Oranda $VERSION" --tag "v$VERSION" --targetCommitish "$GITHUB_SHA"
          done

  integration:
    name: integration (ubuntu, Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      # gvenzl/oracle-free:23-slim 은 Testcontainers 가 직접 pull·기동한다. 러너의 Docker 사용.
      - run: dotnet build Oranda.sln -c Release
      # 2026-10-20: 통합 단계가 49분 만에 「러너 통신 끊김」으로 죽어 로그가 남지 않았다(러너 메모리 고갈 의심: 시험 클래스 15개가 각자 컨테이너를 띄워 동시에 최대 4개).
      # 이제 컨테이너는 하나를 모든 클래스가 공유하고(OracleFreeShared 컬렉션) 클래스는 차례로 돈다. 아래 단계는 그 효과를 로그로 남긴다.
      - name: Resource baseline (before integration tests)
        run: |
          free -m
          docker pull gvenzl/oracle-free:23-slim
          docker system df
          free -m
      # 단계 제한 시간을 두어 로그를 남기고, 시험마다 진행을 찍고, 8분 넘게 멈춘 시험은 blame 으로 이름을 남기고 끊는다.
      # 30초마다 free -m·docker stats 를 같은 단계 로그에 찍어, 러너가 또 죽어도 죽기 직전 메모리가 남게 한다.
      # 시간 기대값(측정 전 추정): 컨테이너 1개를 차례로 쓰므로 기동 2~4분 + 시험 합계. 병렬 때보다 길어질 수 있으나 40분 안에 끝나야 한다.
      - name: Integration tests
        timeout-minutes: 40
        run: |
          ( while true; do echo "--- resources $(date -u +%H:%M:%S)"; free -m | sed -n 1,2p; docker stats --no-stream --format 'table {{.Name}}\t{{.MemUsage}}\t{{.CPUPerc}}'; sleep 30; done ) &
          SAMPLER=$!
          trap 'kill $SAMPLER 2>/dev/null || true' EXIT
          dotnet test Oranda.sln -c Release --no-build --filter "Category=Integration" --logger "console;verbosity=normal" --blame-hang-timeout 8m --blame-hang-dump-type none
      - name: Resource report (after integration tests)
        if: always()
        run: |
          free -m
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          sudo dmesg 2>/dev/null | grep -iE "out of memory|oom|killed process" | tail -n 20 || true
