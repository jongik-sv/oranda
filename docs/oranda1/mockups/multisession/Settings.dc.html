  <div style="width: 150px; background: #252526; border-right: 1px solid #3A3A3A; padding: 12px 0; display: flex; flex-direction: column; font-size: 13px">
    <span style="padding: 7px 16px; color: #BDBDBD">일반</span>
    <span style="padding: 7px 16px; color: #BDBDBD">편집기</span>
    <span style="padding: 7px 16px; color: #FFFFFF; background: #2F3D55; border-left: 2px solid #4C8DF6">접속·세션</span>
    <span style="padding: 7px 16px; color: #BDBDBD">결과</span>
    <span style="padding: 7px 16px; color: #BDBDBD">기능</span>
  </div>
  <div style="flex: 1; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px">
    <div style="font-size: 15px; font-weight: 600">세션</div>
    <div style="display: flex; flex-direction: column; gap: 8px">
      <span style="font-size: 12px; color: #9A9A9A">새 워크스페이스가 처음 실행할 때 쓸 세션</span>
      <label style="display: flex; gap: 10px; align-items: flex-start">
        <input type="radio" name="ws" checked style="margin-top: 3px">
        <span style="display: flex; flex-direction: column; gap: 2px"><span>워크스페이스마다 새 세션</span><span style="font-size: 12px; color: #9A9A9A">다른 워크스페이스가 실행 중이어도 바로 실행됩니다. 트랜잭션이 따로입니다.</span></span>
      </label>
      <label style="display: flex; gap: 10px; align-items: flex-start">
        <input type="radio" name="ws" style="margin-top: 3px">
        <span style="display: flex; flex-direction: column; gap: 2px"><span>지금 접속(공유 세션)을 함께 씀</span><span style="font-size: 12px; color: #9A9A9A">DB 세션 수가 늘지 않습니다. 한쪽이 실행 중이면 다른 쪽은 기다립니다.</span></span>
      </label>
    </div>
    <div style="display: flex; align-items: center; gap: 10px">
      <label for="cap" style="width: 170px">같은 DB 세션 수 상한</label>
      <input id="cap" type="number" value="8" style="width: 70px; height: 26px; box-sizing: border-box; background: #2B2B2B; color: #E4E4E4; border: 1px solid #4A4A4A; border-radius: 4px; padding: 0 8px; font: inherit">
      <span style="font-size: 12px; color: #9A9A9A">접속(프로필)마다</span>
    </div>
    <label style="display: flex; gap: 10px; align-items: center">
      <input type="checkbox" checked>
      <span>공유 세션이 실행 중이면 「새 세션에서 실행」 안내를 보인다</span>
    </label>
    <div style="font-size: 12px; color: #8C8C8C; line-height: 1.6">워크스페이스는 「공유 / 전용」 선택만 기억합니다. 앱을 다시 켜면 세션은 첫 실행 때 엽니다. 비밀번호는 저장하지 않고, 이미 연 접속의 자격 증명으로 새 세션을 엽니다.</div>
