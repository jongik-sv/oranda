<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>세션 닫기 확인</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#7FB0FF}a:hover{color:#A9CAFF}
</style>
</helmet>
<div style="width: 560px; height: 360px; box-sizing: border-box; padding: 24px; background: #141414; font-family: 'Segoe UI', 'Malgun Gothic', system-ui, sans-serif; font-size: 13px; color: #E4E4E4; display: flex; align-items: center; justify-content: center">
  <div style="width: 500px; box-sizing: border-box; background: #2B2B2B; border: 1px solid #454545; border-radius: 8px; display: flex; flex-direction: column">
    <div style="padding: 14px 18px; border-bottom: 1px solid #3A3A3A; font-weight: 600">세션을 닫기 전에</div>
    <div style="padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; line-height: 1.55">
      <div><b>1 - APP_USER@TESTDB</b> 세션에 커밋하지 않은 변경이 있습니다.</div>
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px; background: #232323; border-radius: 4px; font-size: 12px; color: #BDBDBD">
        <span>이 세션을 쓰는 문서 3개: 월말 정산, 조회 탭 2, 조회 탭 3</span>
        <span>변경: INSERT 2 · UPDATE 14 · 마지막 문장 2분 전</span>
      </div>
      <div style="font-size: 12px; color: #A0A0A0">세션을 닫으면 위 문서들은 「접속 안 됨」 이 됩니다. 문서는 닫히지 않습니다.</div>
    </div>
    <div style="padding: 12px 18px; border-top: 1px solid #3A3A3A; display: flex; gap: 8px; justify-content: flex-end">
      <button type="button" style="height: 32px; padding: 0 16px; border: 0; border-radius: 4px; background: #4C8DF6; color: #FFFFFF; font: inherit; font-weight: 600">커밋하고 닫기</button>
      <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid #555; border-radius: 4px; background: transparent; color: #E4E4E4; font: inherit">롤백하고 닫기</button>
      <button type="button" style="height: 32px; padding: 0 16px; border: 1px solid #555; border-radius: 4px; background: transparent; color: #E4E4E4; font: inherit">취소</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":560,"height":360}}'>
class Component extends DCLogic {
renderVals() {
return {};
}
}
</script>
</body>
</html>
